<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#332a33"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="암산왕"><link rel="manifest" href="manifest.webmanifest"><title>오늘만큼은 암산왕</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#332a33;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;touch-action:manipulation}#app{height:100dvh;max-width:540px;margin:auto;display:flex;flex-direction:column;background:radial-gradient(circle at 15% 30%,#65535d 0 2px,transparent 3px),radial-gradient(circle at 72% 42%,#65535d 0 3px,transparent 4px),radial-gradient(circle at 28% 70%,#65535d 0 2px,transparent 3px),#332a33;background-size:180px 210px,250px 260px,220px 230px;position:relative;padding-bottom:env(safe-area-inset-bottom)}.topbar{height:54px;flex-shrink:0;background:#f8f7f5;color:#191719;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:19px;font-weight:800;letter-spacing:-.05em}.close{border:0;background:none;font-size:30px;color:#171717;padding:0 3px}.target-area{height:145px;flex-shrink:0;margin:0 10px;background:#f2eadf;border-radius:0 0 25px 25px;box-shadow:0 5px 0 #b5a9a5;display:flex;justify-content:center;align-items:flex-start;overflow:hidden}.target-bubble{width:160px;height:150px;border-radius:0 0 50% 50%;background:#f0bd55;border:3px solid #d6a54e;border-top:0;display:flex;align-items:center;justify-content:center;color:#090708;font-size:49px;font-weight:950;padding-bottom:13px}.stats{display:flex;align-items:center;gap:13px;padding:23px 18px 20px;flex-shrink:0}.life{height:58px;width:58px;border-radius:50%;background:#c65d4c;border:6px solid #f4e7dc;box-shadow:0 0 0 5px #17131a;display:flex;align-items:center;justify-content:center;font-size:27px;font-weight:900;flex-shrink:0}.progress{height:35px;flex:1;background:#f2e9df;border:5px solid #17131a;border-radius:22px;overflow:hidden;box-shadow:0 0 0 2px #77656a}.progress-in{height:100%;width:100%;background:#c65d4c;transition:width .2s linear}.scorebox{width:105px;border-left:2px solid #594a53;padding-left:16px}.label{font-size:11px;font-weight:850;letter-spacing:.04em;color:#f5dfb6}.score{font-size:28px;font-weight:950;line-height:1.15}.board-wrap{margin:0 10px;flex:1;min-height:0;background:#64515a;border:2px solid #6c5a63;border-radius:23px;padding:16px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}.board{width:100%;max-height:100%;aspect-ratio:1/1;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:clamp(10px,3.4vw,20px);touch-action:none;user-select:none;-webkit-user-select:none}.cell{border:0;border-radius:50%;aspect-ratio:1;background:#302630;color:#fff;display:flex;align-items:center;justify-content:center;font-size:clamp(28px,7.8vw,44px);font-weight:850;box-shadow:none;padding:0;touch-action:none;user-select:none;-webkit-user-select:none}.cell.sel{background:#f0bd55;color:#2b2029;box-shadow:0 0 0 3px #f8df9d;transform:scale(.96)}.bottom{height:92px;flex-shrink:0;position:relative;display:flex;align-items:flex-end;justify-content:space-between;background:#332a33}.teeth{height:47px;width:100%;position:absolute;top:0;left:0;display:flex;justify-content:space-around;align-items:flex-start;pointer-events:none}.tooth{width:0;height:0;border-left:27px solid transparent;border-right:27px solid transparent;border-bottom:42px solid #eee5d8;filter:drop-shadow(0 2px 0 #a99b91)}.floor{height:48px;width:100%;background:#85b1bd;border-top:5px solid #b9d0d0;position:absolute;bottom:0;left:0;box-shadow:inset 0 5px 0 #719ba8}.start{position:absolute;z-index:2;bottom:10px;left:50%;transform:translateX(-50%);border:0;border-radius:20px;background:#f2eadf;color:#2f2530;font-weight:900;padding:10px 23px;font-size:14px;box-shadow:0 3px 0 #b5a9a5;white-space:nowrap}.hint{position:absolute;z-index:2;bottom:16px;left:13px;font-size:10px;color:#e9dce0}.overlay{position:absolute;inset:54px 0 0;background:#332a33f2;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center}.overlay h2{font-size:30px;margin:0 0 8px}.overlay p{color:#eadfe0;line-height:1.7;font-size:14px}.overlay button{border:0;border-radius:24px;background:#f0bd55;color:#251b24;padding:14px 27px;font-size:16px;font-weight:900;margin-top:12px}.sum{position:absolute;top:9px;right:14px;font-size:11px;color:#e8dce0;z-index:1}@media(min-height:800px){.target-area{height:155px}.stats{padding-top:25px;padding-bottom:25px}.board-wrap{margin-left:13px;margin-right:13px;padding:19px}.bottom{height:100px}}
</style></head><body><div id="app"><div class="topbar"><span>오늘만큼은 암산왕</span><button class="close" id="close" aria-label="처음 화면">×</button></div><div class="target-area"><div class="target-bubble" id="target">18</div></div><div class="stats"><div class="life" id="timebadge">30</div><div class="progress"><div class="progress-in" id="progress"></div></div><div class="scorebox"><div class="label">SCORE</div><div class="score" id="score">0</div></div></div><div class="board-wrap"><div class="sum" id="sum">SUM 0</div><div class="board" id="board"></div></div><div class="bottom"><div class="teeth"><div class="tooth"></div><div class="tooth"></div><div class="tooth"></div><div class="tooth"></div></div><div class="floor"></div><div class="hint">드래그해서 숫자 연결</div><button class="start" id="start">게임 시작</button></div><div class="overlay" id="overlay"><h2>오늘만큼은 암산왕</h2><p>30초 동안 숫자를 이어서<br>목표 숫자를 만들어 봐!<br><b>정답: 목표 점수 획득 + 3초</b><br><b>오답: 3초 차감</b><br>대각선으로도 연결할 수 있어.</p><button id="play">게임 시작</button></div></div>
<script>
(()=>{const $=id=>document.getElementById(id),board=$('board');let a=[],path=[],goal=18,score=0,left=30,run=false,drag=false,timer;const rnd=()=>Math.floor(Math.random()*8)+1,near=(x,y)=>x!==y&&Math.abs((x/4|0)-(y/4|0))<=1&&Math.abs(x%4-y%4)<=1,sm=()=>path.reduce((s,i)=>s+a[i],0);
function newGoal(){for(let z=0;z<300;z++){let p=[Math.random()*16|0],len=2+(Math.random()*3|0);while(p.length<len){let q=p[p.length-1],o=[];for(let i=0;i<16;i++)if(!p.includes(i)&&near(q,i))o.push(i);if(!o.length)break;p.push(o[Math.random()*o.length|0])}if(p.length>1){goal=p.reduce((s,i)=>s+a[i],0);return}}goal=a[0]+a[1]}
function draw(){board.innerHTML='';a.forEach((n,i)=>{let b=document.createElement('button');b.className='cell'+(path.includes(i)?' sel':'');b.textContent=n;b.dataset.i=i;b.setAttribute('aria-label','숫자 '+n);board.append(b)});$('target').textContent=goal;$('score').textContent=score;$('sum').textContent='SUM '+sm()}
function updateTime(){left=Math.max(0,Math.min(30,left));$('timebadge').textContent=left;$('progress').style.width=(left/30*100)+'%';if(left<=0)end()}
function begin(){clearInterval(timer);a=Array.from({length:16},rnd);path=[];score=0;left=30;run=true;$('overlay').style.display='none';$('start').textContent='진행 중';$('start').disabled=true;updateTime();newGoal();draw();timer=setInterval(()=>{left--;updateTime()},1000)}
function end(){run=false;drag=false;clearInterval(timer);$('overlay').style.display='flex';$('overlay').innerHTML='<h2>시간 종료!</h2><p>최종 점수</p><div style="font-size:48px;font-weight:950">'+score+'</div><button id="again">다시 도전하기</button>';$('again').onclick=begin;$('start').disabled=false;$('start').textContent='다시 시작'}
function release(){if(!drag)return;drag=false;if(!path.length)return;let s=sm(),n=path.length;if(s===goal){score+=goal;left=Math.min(30,left+3);path.forEach(i=>a[i]=rnd());newGoal();draw();$('sum').textContent='정답! +'+goal+'점 · +3초';$('sum').style.color='#bde9c7';updateTime();setTimeout(()=>{$('sum').style.color=''},650);return}else{left-=3;updateTime();if(run){$('sum').textContent='오답 · -3초';$('sum').style.color='#ff9a8d';setTimeout(()=>{$('sum').style.color=''},650)}}path=[];draw()}
function at(x,y){let el=document.elementFromPoint(x,y),c=el&&el.closest('.cell');return c&&board.contains(c)?+c.dataset.i:null}
function add(i){if(i===null||!run||!drag)return;if(path[path.length-1]===i)return;if(path.length>1&&path[path.length-2]===i){path.pop();draw();return}if(path.includes(i)||path.length&&!near(path[path.length-1],i))return;path.push(i);draw()}
board.addEventListener('pointerdown',e=>{if(!run)return;let c=e.target.closest('.cell');if(!c)return;e.preventDefault();drag=true;path=[+c.dataset.i];try{board.setPointerCapture(e.pointerId)}catch(_){}draw()});board.addEventListener('pointermove',e=>{if(drag){e.preventDefault();add(at(e.clientX,e.clientY))}});board.addEventListener('pointerup',release);board.addEventListener('pointercancel',release);$('start').onclick=begin;$('play').onclick=begin;$('close').onclick=()=>{if(run){run=false;clearInterval(timer)}$('overlay').style.display='flex';$('overlay').innerHTML='<h2>오늘만큼은 암산왕</h2><p>정답은 목표 점수와 3초 보너스!<br>오답은 3초 차감.</p><button id="play2">게임 시작</button>';$('play2').onclick=begin;$('start').disabled=false;$('start').textContent='게임 시작'};a=[4,8,4,8,1,6,5,1,6,7,2,3,4,8,1,3];newGoal();draw()})();
</script></body></html>
